name: dbt CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dbt-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check Python installation
        run: |
          python --version
          python -m pip --version

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          dbt --version

      # The DuckDB file is not versioned, so each run rebuilds it from the fixtures.
      - name: Generate sample data
        run: python scripts/generate_data.py

      - name: Load raw data into DuckDB
        run: python scripts/load_raw.py

      - name: Validate dbt connection
        run: dbt debug --profiles-dir .

      - name: Build and test dbt project
        run: dbt build --profiles-dir .
