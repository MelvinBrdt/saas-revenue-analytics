name: dbt CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dbt-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check Python installation
        run: |
          python --version
          python -m pip --version

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          dbt --version

      # The DuckDB file is not versioned, so each run rebuilds it from the fixtures.
      - name: Generate sample data
        run: python scripts/generate_data.py

      - name: Load raw data into DuckDB
        run: python scripts/load_raw.py

      - name: Validate dbt connection
        run: dbt debug --profiles-dir .

      # Runs before the build so a style issue fails fast.
      - name: Lint SQL
        run: sqlfluff lint models tests

      - name: Build and test dbt project
        run: dbt build --profiles-dir .

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9

      # Rendered on every run, so a report broken by a model change blocks the merge.
      - name: Render financial report
        run: quarto render reports/index.qmd

      - name: Prepare site
        if: github.event_name == 'push'
        run: |
          mkdir _site
          cp -r reports/index.html reports/index_files reports/styles.css _site/

      - name: Upload site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publish-report:
    needs: dbt-build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
