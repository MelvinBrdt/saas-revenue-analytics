  - name: test_fct_invoices_payment_fields
    description: >-
      Le délai se compte depuis la date de facture. Payer le jour de l'échéance
      n'est pas un retard, et une facture non payée n'a ni délai ni retard.
    model: fct_invoices
    given:
      - input: ref('stg_billing__invoices')
        rows:
          - {invoice_id: I1, subscription_id: S1, invoice_date: '2026-01-01', due_date: '2026-01-31', paid_date: '2026-01-31', invoice_status: paid, amount_eur: 100.00}
