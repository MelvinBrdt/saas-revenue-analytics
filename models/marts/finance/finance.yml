
version: 2

models:
  - name: mart_monthly_billing
    description: >-
      Agrégation mensuelle des factures émises, avec une ligne par
      mois d'émission. Les factures paid et open contribuent au
      montant facturé ; les factures void en sont exclues.
      Ce modèle ne mesure ni le MRR, ni les encaissements,
      ni le revenu comptabilisé.

    columns:
      - name: invoice_month
        description: >-
          Premier jour du mois d'émission des factures.
          Clé de granularité du mart.
        data_tests: [unique, not_null]

      - name: billed_amount_eur
        description: >-
          Somme mensuelle des montants facturés en EUR.
          Inclut les factures paid et open, exclut les
          factures void. La V1 ne modélise ni taxes ni avoirs.
        data_tests: [not_null]

      - name: issued_invoice_count
        description: >-
          Nombre de factures non annulées émises pendant
          le mois, soit les factures paid et open.

      - name: paid_invoice_count
        description: >-
          Nombre de factures dont le statut est paid.

      - name: open_invoice_count
        description: >-
          Nombre de factures dont le statut est open.
          Ces factures contribuent au montant facturé
          même si elles ne sont pas encore payées.

      - name: void_invoice_count
        description: >-
          Nombre de factures annulées (statut void).
          Elles sont comptées pour le suivi mais ne
          contribuent pas au montant facturé.

  - name: mart_customer_monthly_billing
    description: >-
      Agrégation des factures par client et par mois d'émission.
      Seuls les mois comportant au moins une facture apparaissent,
      y compris ceux dont toutes les factures sont annulées.
      Se réconcilie avec mart_monthly_billing.
      Ce modèle ne mesure ni le MRR, ni les encaissements,
      ni le revenu comptabilisé.

    columns:
      - name: customer_id
        description: >-
          Identifiant du client facturé.
          Clé de granularité du mart avec invoice_month.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_crm__customers')
                field: customer_id

      - name: invoice_month
        description: >-
          Premier jour du mois d'émission des factures.
          Clé de granularité du mart avec customer_id.
        data_tests: [not_null]

      - name: billed_amount_eur
        description: >-
          Somme des montants facturés au client sur le mois, en EUR.
          Inclut les factures paid et open, exclut les factures void.
          Vaut zéro si toutes les factures du mois sont annulées.
        data_tests: [not_null]

      - name: issued_invoice_count
        description: >-
          Nombre de factures non annulées émises pendant
          le mois, soit les factures paid et open.

      - name: paid_invoice_count
        description: >-
          Nombre de factures dont le statut est paid.

      - name: open_invoice_count
        description: >-
          Nombre de factures dont le statut est open.
          Ces factures contribuent au montant facturé
          même si elles ne sont pas encore payées.

      - name: void_invoice_count
        description: >-
          Nombre de factures annulées (statut void).
          Elles sont comptées pour le suivi mais ne
          contribuent pas au montant facturé.

  - name: mart_customer_monthly_mrr
    description: >-
      Mouvements de MRR par client et par mois. Une ligne existe dès que le
      client a du MRR au début ou à la fin du mois, ce qui conserve le mois
      de son churn. Le MRR mesure le prix des abonnements actifs à la fin
      du mois. Ce modèle ne mesure ni la facturation, ni les encaissements,
      ni le revenu comptabilisé.

    columns:
      - name: customer_id
        description: "Identifiant du client. Clé de granularité avec mrr_month."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_crm__customers')
                field: customer_id

      - name: mrr_month
        description: "Premier jour du mois mesuré. Clé de granularité avec customer_id."
        data_tests: [not_null]

      - name: movement_type
        description: >-
          Mouvement net du client sur le mois : new (premier MRR),
          expansion (hausse), contraction (baisse sans départ),
          churn (passage à zéro), reactivation (retour après un churn)
          ou stable (aucun changement).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['new', 'expansion', 'contraction', 'churn', 'reactivation', 'stable']

      - name: opening_mrr_eur
        description: "MRR à la fin du mois précédent, en EUR."
        data_tests: [not_null]

      - name: new_mrr_eur
        description: "MRR apporté par un nouveau client, en EUR."
        data_tests: [not_null]

      - name: expansion_mrr_eur
        description: "Hausse du MRR d'un client déjà actif, en EUR."
        data_tests: [not_null]

      - name: reactivation_mrr_eur
        description: "MRR d'un client qui revient après un churn, en EUR."
        data_tests: [not_null]

      - name: contraction_mrr_eur
        description: "Baisse du MRR d'un client qui reste actif, en EUR. Montant négatif."
        data_tests: [not_null]

      - name: churned_mrr_eur
        description: "MRR perdu quand le client passe à zéro, en EUR. Montant négatif."
        data_tests: [not_null]

      - name: closing_mrr_eur
        description: "MRR à la fin du mois, en EUR."
        data_tests: [not_null]

  - name: mart_monthly_mrr
    description: >-
      Évolution mensuelle du MRR et taux de churn, avec une ligne par mois
      du calendrier, y compris les mois sans MRR. Ce modèle ne mesure ni la
      facturation, ni les encaissements, ni le revenu comptabilisé.

    columns:
      - name: mrr_month
        description: "Premier jour du mois mesuré. Clé de granularité du mart."
        data_tests: [unique, not_null]

      - name: opening_mrr_eur
        description: "MRR à la fin du mois précédent, en EUR."
        data_tests: [not_null]

      - name: new_mrr_eur
        description: "MRR apporté par les nouveaux clients, en EUR."
        data_tests: [not_null]

      - name: expansion_mrr_eur
        description: "Hausse du MRR des clients déjà actifs, en EUR."
        data_tests: [not_null]

      - name: reactivation_mrr_eur
        description: "MRR des clients revenus après un churn, en EUR."
        data_tests: [not_null]

      - name: contraction_mrr_eur
        description: "Baisse du MRR des clients qui restent actifs, en EUR. Montant négatif."
        data_tests: [not_null]

      - name: churned_mrr_eur
        description: "MRR perdu par les clients passés à zéro, en EUR. Montant négatif."
        data_tests: [not_null]

      - name: closing_mrr_eur
        description: "MRR à la fin du mois, en EUR."
        data_tests: [not_null]

      - name: opening_customer_count
        description: "Nombre de clients avec du MRR à la fin du mois précédent."

      - name: new_customer_count
        description: "Nombre de nouveaux clients sur le mois."

      - name: reactivated_customer_count
        description: "Nombre de clients revenus après un churn."

      - name: churned_customer_count
        description: "Nombre de clients passés à zéro sur le mois."

      - name: closing_customer_count
        description: "Nombre de clients avec du MRR à la fin du mois."

      - name: gross_mrr_churn_rate
        description: >-
          Part du MRR d'ouverture perdue sur le mois, par churn ou contraction.
          NULL si le mois s'ouvre sans MRR.

      - name: customer_churn_rate
        description: >-
          Part des clients d'ouverture perdus sur le mois.
          NULL si le mois s'ouvre sans client.

  - name: dim_customers
    description: >-
      Référentiel des clients, avec une ligne par client. Il apporte le nom
      et le pays aux analyses, y compris pour un client sans abonnement.

    columns:
      - name: customer_id
        description: "Identifiant du client. Clé de granularité du modèle."
        data_tests: [unique, not_null]

      - name: customer_name
        description: "Nom du client."
        data_tests: [not_null]

      - name: country_code
        description: "Code pays du client, en majuscules."
        data_tests: [not_null]

      - name: created_date
        description: "Date de création du client dans le CRM."
        data_tests: [not_null]

      - name: first_subscription_date
        description: >-
          Date de début du premier abonnement du client.
          NULL si le client n'a jamais eu d'abonnement.

  - name: mart_open_invoices
    description: >-
      Balance âgée : une ligne par facture en attente de paiement à la date
      d'arrêt, soit le dernier jour du dernier mois du calendrier. Le retard
      se calcule par rapport à l'échéance, pour que les résultats ne dépendent
      pas de la date d'exécution.

    columns:
      - name: invoice_id
        description: "Identifiant de la facture. Clé de granularité du mart."
        data_tests: [unique, not_null]

      - name: customer_id
        description: "Identifiant du client."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: invoice_date
        description: "Date d'émission de la facture."
        data_tests: [not_null]

      - name: due_date
        description: "Date d'échéance de la facture."
        data_tests: [not_null]

      - name: amount_eur
        description: "Montant restant à encaisser, en EUR."
        data_tests: [not_null]

      - name: closing_date
        description: "Date d'arrêt utilisée pour calculer le retard."
        data_tests: [not_null]

      - name: days_overdue
        description: "Nombre de jours de retard à la date d'arrêt. Zéro si la facture n'est pas échue."
        data_tests: [not_null]

      - name: aging_bucket
        description: "Tranche de retard de la facture."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['not_due', '1_30_days', '31_60_days', '61_90_days', 'over_90_days']

  - name: mart_customer_payment_behavior
    description: >-
      Comportement de paiement, avec une ligne par client ayant au moins une
      facture payée. Les factures en attente et annulées n'y entrent pas.

    columns:
      - name: customer_id
        description: "Identifiant du client. Clé de granularité du mart."
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: paid_invoice_count
        description: "Nombre de factures payées."
        data_tests: [not_null]

      - name: total_days_to_pay
        description: >-
          Somme des délais de paiement, en jours. Elle permet de calculer une
          moyenne sur plusieurs clients sans faire la moyenne de moyennes.
        data_tests: [not_null]

      - name: avg_days_to_pay
        description: "Délai moyen entre la facture et son paiement, en jours."
        data_tests: [not_null]

      - name: late_paid_invoice_count
        description: "Nombre de factures payées après leur échéance."
        data_tests: [not_null]

      - name: late_payment_rate
        description: "Part des factures payées après leur échéance."
        data_tests: [not_null]

  - name: mart_budget_vs_actual
    description: >-
      Écarts au budget, avec une ligne par mois du calendrier. Un écart positif
      signifie que le réalisé dépasse le budget. Le réalisé vient des marts de
      facturation et de MRR, le budget du seed budget_monthly.

    columns:
      - name: budget_month
        description: "Premier jour du mois. Clé de granularité du mart."
        data_tests: [unique, not_null]

      - name: billed_amount_eur
        description: "Montant facturé sur le mois, en EUR. Zéro si le mois n'a aucune facture."
        data_tests: [not_null]

      - name: budget_billed_eur
        description: "Montant facturé prévu au budget, en EUR. Un mois sans budget fait échouer le test."
        data_tests: [not_null]

      - name: billed_variance_eur
        description: "Facturé moins budget, en EUR."
        data_tests: [not_null]

      - name: billed_variance_rate
        description: "Écart de facturé rapporté au budget. NULL si le budget vaut zéro."

      - name: closing_mrr_eur
        description: "MRR à la fin du mois, en EUR."
        data_tests: [not_null]

      - name: budget_closing_mrr_eur
        description: "MRR de fin de mois prévu au budget, en EUR. Un mois sans budget fait échouer le test."
        data_tests: [not_null]

      - name: mrr_variance_eur
        description: "MRR moins budget, en EUR."
        data_tests: [not_null]

      - name: mrr_variance_rate
        description: "Écart de MRR rapporté au budget. NULL si le budget vaut zéro."

  - name: mart_monthly_mrr_by_plan
    description: >-
      MRR de fin de mois par plan, avec une ligne par plan et par mois où il
      compte au moins un abonnement actif. Se réconcilie avec mart_monthly_mrr.

    columns:
      - name: plan_code
        description: "Code du plan. Clé de granularité avec mrr_month."
        data_tests: [not_null]

      - name: mrr_month
        description: "Premier jour du mois mesuré. Clé de granularité avec plan_code."
        data_tests: [not_null]

      - name: closing_mrr_eur
        description: "MRR du plan à la fin du mois, en EUR."
        data_tests: [not_null]

      - name: active_subscription_count
        description: "Nombre d'abonnements actifs du plan à la fin du mois."
        data_tests: [not_null]

      - name: mrr_share
        description: "Part du plan dans le MRR du mois."
        data_tests: [not_null]

  - name: mart_finance_kpis
    description: >-
      Indicateurs clés à la date d'arrêt, sur une seule ligne. Les indicateurs
      de période portent sur tout le calendrier, et la rétention compare le
      dernier mois à trois mois plus tôt. Les taux illustrent une méthode sur
      des données fictives.

    columns:
      - name: closing_date
        description: "Date d'arrêt : dernier jour du calendrier."
        data_tests: [unique, not_null]

      - name: retention_base_month
        description: "Mois de référence de la rétention : trois mois avant le dernier mois."

      - name: closing_mrr_eur
        description: "MRR à la date d'arrêt, en EUR."
        data_tests: [not_null]

      - name: closing_customer_count
        description: "Nombre de clients avec du MRR à la date d'arrêt."
        data_tests: [not_null]

      - name: arr_eur
        description: "Revenu récurrent annualisé : MRR de clôture multiplié par 12. Ce n'est pas une prévision."
        data_tests: [not_null]

      - name: arpa_eur
        description: "Revenu moyen par client : MRR de clôture divisé par le nombre de clients."

      - name: net_revenue_retention_rate
        description: >-
          Rétention nette (NRR) : MRR actuel des clients présents au mois de
          référence, rapporté à leur MRR de l'époque. L'expansion peut compenser
          les pertes. Les nouveaux clients n'y entrent pas.

      - name: gross_revenue_retention_rate
        description: >-
          Rétention brute (GRR) : même calcul sans l'expansion, car un client ne
          peut pas compter pour plus que son MRR de référence. Ne dépasse jamais 100 %.

      - name: billed_amount_eur
        description: "CA facturé sur la période, en EUR."
        data_tests: [not_null]

      - name: budget_billed_eur
        description: "CA facturé prévu au budget sur la période, en EUR."
        data_tests: [not_null]

      - name: billed_budget_attainment_rate
        description: "Taux de réalisation du budget de CA."

      - name: mrr_budget_attainment_rate
        description: "MRR de clôture rapporté au MRR prévu au budget pour le dernier mois."

      - name: open_amount_eur
        description: "Encours client à la date d'arrêt, en EUR."
        data_tests: [not_null]

      - name: overdue_amount_eur
        description: "Créances échues à la date d'arrêt, en EUR."
        data_tests: [not_null]

      - name: overdue_share_rate
        description: "Part des créances échues dans l'encours client."

      - name: days_sales_outstanding
        description: >-
          DSO : encours client rapporté au CA facturé, multiplié par le nombre de
          jours de la période. Les montants sont hors taxes dans ce projet, alors
          qu'un DSO comptable se calcule souvent sur des créances TTC.

      - name: paid_invoice_count
        description: "Nombre de factures payées."
        data_tests: [not_null]

      - name: avg_days_to_pay
        description: "Délai moyen de paiement par facture, en jours."

      - name: amount_weighted_days_to_pay
        description: "Délai moyen de paiement pondéré par le montant des factures, en jours."

      - name: late_payment_rate
        description: "Part des factures payées après leur échéance."

      - name: top_customer_share
        description: "Part du premier client dans le CA facturé."

      - name: top_3_customers_share
        description: "Part des trois premiers clients dans le CA facturé."

  - name: fct_invoices
    description: >-
      Table de faits à la granularité d'une facture.
      Conserve les factures annulées et enrichit chaque
      facture avec le client associé à son abonnement.
      Centralise le calcul du montant facturé utilisable
      par les modèles analytiques.

    columns:
      - name: invoice_id
        description: >-
          Identifiant unique de la facture.
          Clé de granularité de la table.
        data_tests:
          - not_null
          - unique

      - name: subscription_id
        description: "Identifiant de l'abonnement facturé."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_billing__subscriptions')
                field: subscription_id

      - name: customer_id
        description: >-
          Identifiant du client associé à l'abonnement
          de la facture.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_crm__customers')
                field: customer_id

      - name: invoice_date
        description: "Date d'émission de la facture."
        data_tests:
          - not_null

      - name: due_date
        description: "Date d'échéance de la facture."

      - name: paid_date
        description: "Date de paiement de la facture. NULL si elle n'est pas payée."

      - name: days_to_pay
        description: "Nombre de jours entre la facture et son paiement. NULL si elle n'est pas payée."

      - name: is_paid_late
        description: "Vrai si la facture a été payée après son échéance. NULL si elle n'est pas payée."

      - name: invoice_status
        description: >-
          Statut de la facture : paid (payée),
          open (ouverte), void (annulée).

      - name: amount_eur
        description: >-
          Montant initial de la facture en EUR,
          conservé quel que soit son statut.

      - name: billed_amount_eur
        description: >-
          Montant contribuant à la facturation en EUR.
          Égal à amount_eur pour les statuts paid et open,
          et à zéro pour le statut void.
          Ne représente pas un encaissement.
        data_tests:
          - not_null

unit_tests:
  - name: test_customer_monthly_billing_aggregates_invoices
    description: >-
      Plusieurs factures d'un même client et d'un même mois donnent
      une seule ligne, et un mois sans facture active garde un
      montant à zéro.
    model: mart_customer_monthly_billing
    given:
      - input: ref('fct_invoices')
        rows:
          - {customer_id: C001, invoice_date: '2026-01-05', invoice_status: paid, billed_amount_eur: 100.00}
          - {customer_id: C001, invoice_date: '2026-01-20', invoice_status: void, billed_amount_eur: 0.00}
          - {customer_id: C001, invoice_date: '2026-01-25', invoice_status: open, billed_amount_eur: 50.00}
          - {customer_id: C001, invoice_date: '2026-02-03', invoice_status: paid, billed_amount_eur: 100.00}
          - {customer_id: C002, invoice_date: '2026-01-10', invoice_status: void, billed_amount_eur: 0.00}
    expect:
      rows:
        - {customer_id: C001, invoice_month: '2026-01-01', billed_amount_eur: 150.00, issued_invoice_count: 2, paid_invoice_count: 1, open_invoice_count: 1, void_invoice_count: 1}
        - {customer_id: C001, invoice_month: '2026-02-01', billed_amount_eur: 100.00, issued_invoice_count: 1, paid_invoice_count: 1, open_invoice_count: 0, void_invoice_count: 0}
        - {customer_id: C002, invoice_month: '2026-01-01', billed_amount_eur: 0.00, issued_invoice_count: 0, paid_invoice_count: 0, open_invoice_count: 0, void_invoice_count: 1}

  - name: test_fct_invoices_billed_amount_follows_status
    description: >-
      Les valeurs attendues sont écrites à la main pour ne pas recopier
      la règle du modèle. Les factures paid et open gardent leur montant,
      les factures void valent zéro, et une facture sans abonnement connu
      reste présente avec un client nul.
    model: fct_invoices
    given:
      - input: ref('stg_billing__invoices')
        rows:
          - {invoice_id: I1, subscription_id: S1, invoice_date: '2026-01-05', invoice_status: paid, amount_eur: 100.00}
          - {invoice_id: I2, subscription_id: S1, invoice_date: '2026-01-06', invoice_status: open, amount_eur: 50.00}
          - {invoice_id: I3, subscription_id: S2, invoice_date: '2026-01-07', invoice_status: void, amount_eur: 75.00}
          - {invoice_id: I4, subscription_id: S9, invoice_date: '2026-01-08', invoice_status: paid, amount_eur: 20.00}
      - input: ref('stg_billing__subscriptions')
        rows:
          - {subscription_id: S1, customer_id: C1}
          - {subscription_id: S2, customer_id: C2}
    expect:
      rows:
        - {invoice_id: I1, customer_id: C1, amount_eur: 100.00, billed_amount_eur: 100.00}
        - {invoice_id: I2, customer_id: C1, amount_eur: 50.00, billed_amount_eur: 50.00}
        - {invoice_id: I3, customer_id: C2, amount_eur: 75.00, billed_amount_eur: 0.00}
        - {invoice_id: I4, customer_id: null, amount_eur: 20.00, billed_amount_eur: 20.00}

  - name: test_customer_monthly_mrr_classifies_movements
    description: >-
      Le parcours de C1 couvre chaque mouvement, dont le churn qui garde sa
      ligne, le mois sans MRR qui n'en a pas et le retour en réactivation.
      C2 arrive tardivement et reste un nouveau client.
    model: mart_customer_monthly_mrr
    given:
      - input: ref('int_months')
        rows:
          - {month_start: '2026-01-01', month_end: '2026-01-31'}
          - {month_start: '2026-02-01', month_end: '2026-02-28'}
          - {month_start: '2026-03-01', month_end: '2026-03-31'}
          - {month_start: '2026-04-01', month_end: '2026-04-30'}
          - {month_start: '2026-05-01', month_end: '2026-05-31'}
          - {month_start: '2026-06-01', month_end: '2026-06-30'}
          - {month_start: '2026-07-01', month_end: '2026-07-31'}
          - {month_start: '2026-08-01', month_end: '2026-08-31'}
      - input: ref('int_customer_monthly_mrr')
        rows:
          - {customer_id: C1, mrr_month: '2026-01-01', mrr_eur: 100.00}
          - {customer_id: C1, mrr_month: '2026-02-01', mrr_eur: 100.00}
          - {customer_id: C1, mrr_month: '2026-03-01', mrr_eur: 150.00}
          - {customer_id: C1, mrr_month: '2026-04-01', mrr_eur: 120.00}
          - {customer_id: C1, mrr_month: '2026-07-01', mrr_eur: 80.00}
          - {customer_id: C1, mrr_month: '2026-08-01', mrr_eur: 80.00}
          - {customer_id: C2, mrr_month: '2026-08-01', mrr_eur: 40.00}
    expect:
      rows:
