  - name: test_budget_vs_actual_variances
    description: >-
      Un écart positif signifie que le réalisé dépasse le budget. Un mois sans
      facture compte zéro facturé, et un budget à zéro donne un taux NULL.
    model: mart_budget_vs_actual
    given:
      - input: ref('int_months')
        rows:
          - {month_start: '2026-01-01', month_end: '2026-01-31'}
          - {month_start: '2026-02-01', month_end: '2026-02-28'}
          - {month_start: '2026-03-01', month_end: '2026-03-31'}
      - input: ref('budget_monthly')
        rows:
          - {budget_month: '2026-01-01', budget_billed_eur: 100.00, budget_closing_mrr_eur: 100.00}
          - {budget_month: '2026-02-01', budget_billed_eur: 50.00, budget_closing_mrr_eur: 0.00}
          - {budget_month: '2026-03-01', budget_billed_eur: 100.00, budget_closing_mrr_eur: 100.00}
      - input: ref('mart_monthly_billing')
        rows:
