          - {invoice_id: I3, subscription_id: S1, invoice_date: '2026-03-01', due_date: '2026-03-31', paid_date: null, invoice_status: open, amount_eur: 100.00}
      - input: ref('stg_billing__subscriptions')
        rows:
          - {subscription_id: S1, customer_id: C1}
    expect:
      rows:
        - {invoice_id: I1, due_date: '2026-01-31', paid_date: '2026-01-31', days_to_pay: 30, is_paid_late: false}
        - {invoice_id: I2, due_date: '2026-03-03', paid_date: '2026-03-04', days_to_pay: 31, is_paid_late: true}
        - {invoice_id: I3, due_date: '2026-03-31', paid_date: null, days_to_pay: null, is_paid_late: null}

