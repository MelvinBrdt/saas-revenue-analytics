name: 'saas_revenue_analytics'
version: '1.0.0'
config-version: 2
profile: 'saas_revenue_analytics'
model-paths: ['models']
test-paths: ['tests']
seed-paths: ['seeds']
clean-targets: ['target', 'dbt_packages']
models:
  saas_revenue_analytics:
    # Staging stays a view, cheap to rebuild and not meant for consumers.
    # Marts are tables because dashboards and analysts query them directly.
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
seeds:
  saas_revenue_analytics:
    +schema: reference
    budget_monthly:
      # Explicit types: amounts stay exact and a malformed value fails the load.
      +column_types:
        budget_month: date
        budget_billed_eur: decimal(14, 2)
        budget_closing_mrr_eur: decimal(14, 2)
