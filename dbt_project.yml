name: 'saas_revenue_analytics'
version: '1.0.0'
config-version: 2
profile: 'saas_revenue_analytics'
model-paths: ['models']
test-paths: ['tests']
clean-targets: ['target', 'dbt_packages']
models:
  saas_revenue_analytics:
    # Staging stays a view, cheap to rebuild and not meant for consumers.
    # Marts are tables because dashboards and analysts query them directly.
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
